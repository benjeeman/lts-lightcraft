<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LightCraft</title>
  <link rel="icon" href="data:,">
  <meta name="description" content="LightCraft: open-source photo library and raw developer, running in your browser (WASM).">
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1c1c1c; }
    canvas#lightcraft_canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #lightcraft_loading {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #b8b8b8; font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; pointer-events: none;
    }
    #lightcraft_status { position: absolute; left: 0; bottom: 0; width: 1px; height: 1px; overflow: hidden; }
  </style>
</head>
<body>
  <canvas id="lightcraft_canvas"></canvas>
  <div id="lightcraft_loading">Loading LightCraft…</div>
  <div id="lightcraft_status" aria-live="polite"></div>
  <script id="lts-editor-presentation">
    // LTS host presentation: `?embedded` (the exact name's presence, read as the wasm reads it)
    // renames only this page's own copy, before anything loads. Storage, workers, the canvas and
    // the byte bridge are unchanged.
    const ltsEmbeddedPresentation = new URLSearchParams(location.search).has("embedded");
    const lightcraftLoadFailurePrefix = ltsEmbeddedPresentation ? "LTS Image adjustments failed to load: " : "LightCraft failed to load: ";
    if (ltsEmbeddedPresentation) {
      document.title = "LTS Image adjustments";
      document.querySelector('meta[name="description"]')?.setAttribute("content", "LTS Image adjustments: photo adjustments in the browser (WASM).");
      document.getElementById("lightcraft_loading").textContent = "Loading LTS Image adjustments…";
    }
  </script>
  <script type="module">
    import init, { start, command } from "./lightcraft_web.js";
    import { installLtsByteBridge } from "./lts-byte-bridge.js";
    (async () => {
      // Compile once; the render workers (worker.js) instantiate the same compiled module.
      const module = await WebAssembly.compileStreaming(fetch("./lightcraft_web_bg.wasm"));
      globalThis.lightcraftModule = module;
      await init({ module_or_path: module });
      // automation: `await lightcraft.command("library.info", "{}")` → JSON text
      globalThis.lightcraft = installLtsByteBridge({ command });
      start();
    })().catch((e) => {
      console.error(e);
      const el = document.getElementById("lightcraft_loading");
      if (el) el.textContent = lightcraftLoadFailurePrefix + e;
    });
  </script>
</body>
</html>
